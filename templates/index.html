<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabInvoice 报销管家 - 我的任务</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
        /* 隐藏数字输入框的上下箭头 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* 漂亮的滚动条 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 呼吸光晕背景 */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.08), transparent 25%);
            z-index: -1; pointer-events: none;
        }
    </style>
</head>
<body class="selection:bg-indigo-200 selection:text-indigo-900 pb-16">
    <div class="ambient-bg"></div>
    
    <!-- 顶部状态栏 -->
    <nav class="sticky top-0 z-40 bg-white/70 backdrop-blur-xl border-b border-slate-200/50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3.5">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-[14px] shadow-lg shadow-indigo-500/30">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <div>
                    <p class="text-[11px] font-bold text-slate-400 tracking-widest uppercase mb-0.5">LabInvoice</p>
                    <p class="font-black text-slate-800 text-lg leading-none">{{ real_name }} <span class="font-semibold text-sm text-slate-500 ml-1">的工作台</span></p>
                </div>
            </div>
            <a href="/logout" class="text-sm text-slate-500 hover:text-red-600 hover:bg-red-50 px-4 py-2.5 rounded-xl transition-all font-bold flex items-center gap-1.5 border border-transparent hover:border-red-100">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                安全退出
            </a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto mt-12 px-6">
        <div class="mb-10">
            <h2 class="text-3xl font-black text-slate-800 tracking-tight">📌 报销任务大厅</h2>
            <p class="text-sm text-slate-500 font-medium mt-2">选择下方任务卡片，上传并管理您的发票与附件。</p>
        </div>
        
        <div id="tasksContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-16 text-center text-slate-400 font-medium">
                <div class="animate-pulse flex flex-col items-center">
                    <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
                    正在加载任务数据...
                </div>
            </div>
        </div>
    </main>

    <!-- 弹窗：报销条目管理 -->
    <div id="taskModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm overflow-y-auto h-full w-full flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-6xl mx-4 my-8 relative border border-white">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500"></div>

            <div class="flex justify-between items-start mb-6 pb-5 border-b border-slate-100">
                <div class="pr-8">
                    <h3 id="modalTitle" class="text-2xl font-black text-slate-800 leading-tight">任务详情</h3>
                    <p class="text-xs text-slate-400 font-bold mt-1.5 tracking-wide uppercase" id="modalStatusText">STATUS</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 bg-slate-50 hover:bg-slate-200 p-2.5 rounded-full transition-colors shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <input type="hidden" id="currentTaskId">
            <input type="hidden" id="currentTaskType">

            <div class="flex flex-col lg:flex-row gap-10">
                <!-- 左侧：新增报销归类 -->
                <div id="uploadSection" class="w-full lg:w-5/12 bg-slate-50/80 p-6 rounded-[2rem] border border-slate-200/60 shadow-inner flex flex-col h-full">
                    <h4 class="font-black text-indigo-700 flex items-center gap-2 text-lg mb-5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                        新增报销归类 <span class="text-[10px] font-bold bg-indigo-100 text-indigo-600 px-2 py-1 rounded-md uppercase tracking-wider">批量上传支持</span>
                    </h4>
                    <form id="uploadForm" class="space-y-5 flex-1">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-3">发票类别 <span class="text-red-500">*</span></label>
                            <div class="grid grid-cols-2 gap-3" id="typeRadioGroup">
                                <!-- 动态插入：日常业务报销或国内差旅费对应的选项 -->
                            </div>
                            <div id="typeHint" class="hidden mt-3 p-3 bg-white border border-indigo-100 rounded-xl shadow-sm text-xs text-slate-600 leading-relaxed"></div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">主发票文件 <span class="text-red-500">*</span></label>
                            <input type="file" id="invoiceFiles" name="invoice_files" multiple accept=".pdf" required 
                                class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-sm file:font-black file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 file:cursor-pointer border border-slate-200 p-1.5 rounded-2xl bg-white shadow-sm cursor-pointer transition-colors">
                            <p class="text-xs text-slate-400 mt-2 font-medium ml-1">仅支持PDF。系统将智能提取发票总额。</p>
                        </div>

                        <div id="attachmentArea" class="hidden p-5 bg-white border border-dashed border-slate-300 rounded-2xl">
                            <label id="attachmentLabel" class="block text-sm font-bold text-slate-700 mb-2">附件 <span id="attReqStar" class="text-red-500 hidden">*</span></label>
                            <input type="file" id="attachments" name="attachments" multiple accept=".pdf,image/*,.doc,.docx,.xls,.xlsx,.zip,.rar,.7z" 
                                class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-5 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 file:cursor-pointer border border-transparent p-1 rounded-2xl cursor-pointer">
                            <p id="attachmentHint" class="text-xs text-slate-500 mt-2 font-medium ml-1 leading-relaxed bg-slate-50 p-2 rounded-lg border border-slate-100"></p>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">补充备注 <span class="text-slate-400 font-medium">(选填)</span></label>
                            <textarea name="remark" rows="2" placeholder="填写说明..." 
                                class="w-full px-4 py-3 bg-white border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm font-medium text-slate-700 shadow-sm"></textarea>
                        </div>

                        <button type="submit" id="saveDraftBtn" class="w-full bg-indigo-50 text-indigo-700 border border-indigo-100 hover:bg-indigo-100 hover:border-indigo-200 px-4 py-3.5 rounded-2xl text-sm font-black transition-all mt-4 shadow-sm">
                            📥 保存此归类至草稿箱
                        </button>
                    </form>
                </div>

                <!-- 右侧：已保存的报销归类 -->
                <div id="rightCol" class="w-full lg:w-7/12 flex flex-col transition-all duration-300">
                    <div class="mb-4">
                        <p class="text-lg font-extrabold text-slate-800 flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> 已保存的报销归类
                        </p>
                    </div>
                    
                    <div id="itemList" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar flex-1"></div>
                    
                    <div id="submitActionSection" class="pt-6 mt-6 border-t border-slate-200/60 shrink-0">
                        <button onclick="submitFinal()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-black py-4 px-4 rounded-2xl hover:shadow-[0_8px_20px_-6px_rgba(79,70,229,0.6)] hover:-translate-y-0.5 transition-all duration-200 text-base">
                            🚀 确认无误，正式提交该任务
                        </button>
                        <p class="text-xs text-slate-400 mt-3 text-center font-semibold">⚠️ 提交后即锁定，无法再新增或修改发票。</p>
                    </div>
                    
                    <!-- 已完成提示区 -->
                    <div id="submittedSection" class="hidden bg-slate-50 border border-slate-200 p-6 rounded-2xl mt-4 text-center">
                        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-200 mb-3">
                            <svg class="w-6 h-6 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <p id="submittedHintText" class="text-slate-600 font-bold">您已完成此任务的提交。如需修改请联系管理员打回重做。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchTasks);

        async function fetchTasks() {
            try {
                const res = await fetch('/api/user/tasks');
                const tasks = await res.json();
                renderTasks(tasks);
            } catch (error) {
                document.getElementById('tasksContainer').innerHTML = '<div class="col-span-full text-center text-red-500 font-bold bg-red-50 py-8 rounded-2xl">获取任务失败，请刷新重试。</div>';
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-20 flex flex-col items-center justify-center text-center bg-white rounded-[2rem] border border-slate-100 shadow-sm">
                        <span class="text-6xl mb-4">🎉</span>
                        <h3 class="text-xl font-bold text-slate-700">您目前没有待处理的任务</h3>
                        <p class="text-slate-400 font-medium mt-1">管理员派发任务后将在这里显示</p>
                    </div>`;
                return;
            }

            container.innerHTML = tasks.map(task => {
                let statusClass, statusText, icon, amountColor, actionBtn, blobColor;
                
                if (task.is_completed === 1) {
                    statusClass = "bg-slate-50 border-slate-200 grayscale-[0.5]";
                    blobColor = "from-slate-200 to-slate-100";
                    amountColor = "text-slate-400";
                    statusText = "已结项 (锁定)";
                    icon = "🔒";
                    actionBtn = '<span class="text-xs px-4 py-2 text-slate-500 font-bold bg-white border border-slate-200 rounded-xl shadow-sm">查看记录</span>';
                } else if (task.status === 2) {
                    statusClass = "bg-emerald-50/50 border-emerald-100";
                    blobColor = "from-emerald-300 to-teal-200";
                    amountColor = "text-emerald-600";
                    statusText = "已提交待审核";
                    icon = "✅";
                    actionBtn = '<span class="text-xs px-4 py-2 text-emerald-700 font-bold bg-white border border-emerald-100 rounded-xl shadow-sm">查看记录</span>';
                } else if (task.status === 1) {
                    statusClass = "bg-white border-amber-200";
                    blobColor = "from-amber-300 to-orange-200";
                    amountColor = "text-amber-600";
                    statusText = `草稿中 (${task.items.length}笔)`;
                    icon = "📝";
                    actionBtn = '<span class="text-xs bg-gradient-to-r from-amber-500 to-orange-500 text-white px-4 py-2 rounded-xl shadow-md shadow-amber-500/20 font-bold">继续填报</span>';
                } else {
                    statusClass = "bg-white border-indigo-100";
                    blobColor = "from-indigo-300 to-blue-300";
                    amountColor = "text-slate-300"; 
                    statusText = "待填报";
                    icon = "🚀";
                    actionBtn = '<span class="text-xs bg-gradient-to-r from-indigo-600 to-blue-600 text-white px-4 py-2 rounded-xl shadow-md shadow-indigo-500/20 font-bold">立即填报</span>';
                }

                if (task.final_amount > 0 && task.status !== 2 && task.is_completed !== 1) amountColor = "text-indigo-600";
                
                const hasCalibrated = task.items && task.items.some(i => i.is_admin_calibrated);
                let manualBadge = hasCalibrated ? '<span title="管理员已人工校准" class="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded ml-2 font-bold shadow-sm align-middle inline-block -mt-1">👨‍💻 已校准</span>' : '';
                const taskTypeBadge = `<span class="text-[10px] align-middle inline-block -mt-1 ml-1.5 bg-indigo-50 text-indigo-600 font-bold px-1.5 py-0.5 rounded border border-indigo-100">${task.task_type || '日常业务报销'}</span>`;

                const taskData = encodeURIComponent(JSON.stringify(task));
                const isReadOnly = (task.is_completed === 1 || task.status === 2);
                
                return `
                    <div onclick="openModal('${taskData}', ${isReadOnly})" 
                         class="group relative bg-white border-2 rounded-[2rem] p-6 shadow-sm hover:shadow-xl hover:-translate-y-1.5 transition-all duration-300 cursor-pointer overflow-hidden flex flex-col justify-between h-48 ${statusClass}">
                        
                        <div class="absolute -right-8 -top-8 w-32 h-32 bg-gradient-to-br ${blobColor} rounded-full opacity-20 group-hover:scale-150 transition-transform duration-700 ease-out"></div>

                        <div class="relative z-10">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="bg-white/80 backdrop-blur border shadow-sm px-2.5 py-1 rounded-lg text-xs font-black flex items-center gap-1">
                                    ${icon} <span class="opacity-90">${statusText}</span>
                                </span>
                            </div>
                            <h3 class="font-black text-xl text-slate-800 line-clamp-2 leading-snug" title="${task.title}">${task.title}${taskTypeBadge}</h3>
                        </div>

                        <div class="relative z-10 mt-auto flex items-end justify-between border-t border-slate-100/80 pt-4">
                            <div>
                                <p class="text-[10px] text-slate-400 font-extrabold uppercase tracking-widest mb-0.5">本次总计金额</p>
                                <p class="text-2xl font-black ${amountColor}">¥ ${task.final_amount.toFixed(2)}${manualBadge}</p>
                            </div>
                            <div>${actionBtn}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleTypeChange() {
            const checkedRadio = document.querySelector('input[name="type"]:checked');
            const type = checkedRadio ? checkedRadio.value : null;
            
            const area = document.getElementById('attachmentArea');
            const input = document.getElementById('attachments');
            const hint = document.getElementById('attachmentHint');
            const typeHint = document.getElementById('typeHint');
            const reqStar = document.getElementById('attReqStar');
            const currentTaskType = document.getElementById('currentTaskType').value;

            if (!type) {
                area.classList.add('hidden');
                typeHint.classList.add('hidden');
                return;
            }
            
            area.classList.remove('hidden');
            input.required = false;
            reqStar.classList.add('hidden');

            if (currentTaskType === '国内差旅费') {
                typeHint.classList.add('hidden'); // 差旅费无详细说明
                hint.innerText = '单张发票金额超过500元需上传支付记录';
                return;
            }

            // 日常业务报销规则
            let tHintText = '';
            let aHintText = '';

            switch (type) {
                case '市内交通费':
                    tHintText = '市内公交、地铁、出租车费等';
                    aHintText = '必须上传与发票对应的行程单！';
                    input.required = true;
                    reqStar.classList.remove('hidden');
                    break;
                case '专用材料费':
                    tHintText = '教学、科研各种实验用材料、耗材及低值易耗品等';
                    aHintText = '单张发票金额不要超过1000元，若超过，可联系开票方将单张大额发票拆成多张不超过1000元的小发票重新开具。';
                    break;
                case '科研招待费':
                    tHintText = '科研讨论会、组会等产生的餐饮费等';
                    aHintText = '单张发票金额超过500元需上传支付记录';
                    break;
                case '邮电费':
                    tHintText = '邮寄费、电话费、网络通讯费等';
                    aHintText = '可选';
                    break;
                case '印刷费':
                    tHintText = '与实验室有关的印刷支出';
                    aHintText = '单张发票金额超过500元需上传支付记录';
                    break;
                case '其他':
                    tHintText = '以上不包含的事项，需备注说明';
                    aHintText = '单张发票金额超过500元需上传支付记录';
                    break;
            }
            
            typeHint.classList.remove('hidden');
            typeHint.innerHTML = `<span class="text-indigo-500 font-bold mr-1">💡 包含内容：</span>${tHintText}`;
            hint.innerText = aHintText;
        }

        function openModal(taskDataStr, readOnly) {
            const task = JSON.parse(decodeURIComponent(taskDataStr));
            document.getElementById('currentTaskId').value = task.id;
            
            const taskType = task.task_type || '日常业务报销';
            document.getElementById('currentTaskType').value = taskType;
            document.getElementById('modalTitle').innerText = task.title;
            
            let statusBadge = "🔴 未知状态";
            if (task.is_completed === 1) statusBadge = "🔒 任务已结项";
            else if (task.status === 2) statusBadge = "✅ 您的发票已提交审核";
            else if (task.status === 1) statusBadge = "📝 草稿记录中";
            else statusBadge = "🟢 待开始填报";
            document.getElementById('modalStatusText').innerText = statusBadge;
            
            // 渲染动态的分类选项
            const radioGroup = document.getElementById('typeRadioGroup');
            if (taskType === '国内差旅费') {
                radioGroup.className = "grid grid-cols-3 gap-3";
                radioGroup.innerHTML = `
                    <label class="flex items-center justify-center gap-2 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:ring-1 has-[:checked]:ring-indigo-500 shadow-sm">
                        <input type="radio" name="type" value="交通费" required onchange="handleTypeChange()" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="text-sm font-bold text-slate-700">交通费</span>
                    </label>
                    <label class="flex items-center justify-center gap-2 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:ring-1 has-[:checked]:ring-indigo-500 shadow-sm">
                        <input type="radio" name="type" value="住宿费" required onchange="handleTypeChange()" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="text-sm font-bold text-slate-700">住宿费</span>
                    </label>
                    <label class="flex items-center justify-center gap-2 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:ring-1 has-[:checked]:ring-indigo-500 shadow-sm">
                        <input type="radio" name="type" value="其他费用" required onchange="handleTypeChange()" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="text-sm font-bold text-slate-700">其他费用</span>
                    </label>
                `;
            } else {
                radioGroup.className = "grid grid-cols-2 gap-3";
                radioGroup.innerHTML = `
                    <label class="flex items-center gap-2 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:ring-1 has-[:checked]:ring-indigo-500 shadow-sm">
                        <input type="radio" name="type" value="市内交通费" required onchange="handleTypeChange()" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="text-sm font-bold text-slate-700">市内交通费</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:ring-1 has-[:checked]:ring-indigo-500 shadow-sm">
                        <input type="radio" name="type" value="专用材料费" required onchange="handleTypeChange()" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="text-sm font-bold text-slate-700">专用材料费</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:ring-1 has-[:checked]:ring-indigo-500 shadow-sm">
                        <input type="radio" name="type" value="科研招待费" required onchange="handleTypeChange()" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="text-sm font-bold text-slate-700">科研招待费</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:ring-1 has-[:checked]:ring-indigo-500 shadow-sm">
                        <input type="radio" name="type" value="邮电费" required onchange="handleTypeChange()" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="text-sm font-bold text-slate-700">邮电费</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:ring-1 has-[:checked]:ring-indigo-500 shadow-sm">
                        <input type="radio" name="type" value="印刷费" required onchange="handleTypeChange()" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="text-sm font-bold text-slate-700">印刷费</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 bg-white border border-slate-200 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-200 transition-all has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-500 has-[:checked]:ring-1 has-[:checked]:ring-indigo-500 shadow-sm">
                        <input type="radio" name="type" value="其他" required onchange="handleTypeChange()" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="text-sm font-bold text-slate-700">其他</span>
                    </label>
                `;
            }

            renderItemList(task.items, readOnly, task.id);

            const rightCol = document.getElementById('rightCol');
            if (readOnly) {
                document.getElementById('uploadSection').classList.add('hidden');
                document.getElementById('submittedSection').classList.remove('hidden');
                document.getElementById('submitActionSection').classList.add('hidden');
                
                rightCol.classList.remove('lg:w-7/12');
                rightCol.classList.add('lg:w-full');
                
                if (task.is_completed === 1) {
                    document.getElementById('submittedHintText').innerHTML = "<span class='text-slate-600 font-black text-lg block mb-1'>🔒 任务已结项</span>管理员已永久结束此任务，停止所有修改。";
                } else {
                    document.getElementById('submittedHintText').innerHTML = "<span class='text-emerald-600 font-black text-lg block mb-1'>✅ 已提交待审核</span>您已完成此任务的提交。如需修改请联系管理员打回重做。";
                }
            } else {
                document.getElementById('uploadSection').classList.remove('hidden');
                document.getElementById('submittedSection').classList.add('hidden');
                document.getElementById('submitActionSection').classList.remove('hidden');
                
                rightCol.classList.remove('lg:w-full');
                rightCol.classList.add('lg:w-7/12');
                
                document.getElementById('uploadForm').reset();
                document.querySelectorAll('input[name="type"]').forEach(r => r.checked = false);
                handleTypeChange();
            }

            const modal = document.getElementById('taskModal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.add('opacity-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('taskModal');
            modal.classList.add('hidden');
            fetchTasks(); 
        }

        function renderItemList(items, readOnly, taskId) {
            const list = document.getElementById('itemList');
            if (!taskId) taskId = document.getElementById('currentTaskId').value;

            if (!items || items.length === 0) {
                list.innerHTML = `
                    <div class="text-sm text-slate-400 font-bold p-8 bg-slate-50 rounded-2xl text-center border-2 border-dashed border-slate-200">
                        暂无任何记录，请在左侧表单中添加
                    </div>`;
                return;
            }

            list.innerHTML = items.map((item, index) => {
                let invHtml = '';
                if(item.invoice_files && item.invoice_files.length > 0) {
                    invHtml = item.invoice_files.map(i => `<a href="/api/user/view_file/${taskId}/${item.id}/${encodeURIComponent(i)}" target="_blank" class="block truncate text-indigo-600 hover:text-indigo-800 hover:underline transition-colors" title="点击预览文件">📄 ${i}</a>`).join('');
                } else if(item.invoice_file) {
                    invHtml = `<a href="/api/user/view_file/${taskId}/${item.id}/${encodeURIComponent(item.invoice_file)}" target="_blank" class="block truncate text-indigo-600 hover:text-indigo-800 hover:underline transition-colors" title="点击预览文件">📄 ${item.invoice_file}</a>`;
                }

                let attHtml = item.attachments.map(a => `<a href="/api/user/view_file/${taskId}/${item.id}/${encodeURIComponent(a)}" target="_blank" class="block truncate text-slate-600 hover:text-indigo-600 hover:underline transition-colors" title="点击预览文件">📎 ${a}</a>`).join('');
                if (!attHtml) attHtml = '<span class="text-slate-400 italic block">无</span>';

                let amountUI = '';
                if (readOnly) {
                    const calibBadge = item.is_admin_calibrated ? `<span class="ml-1 text-[10px] text-emerald-600 font-bold bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">👨‍💻 校准</span>` : '';
                    amountUI = `<span class="ml-3 text-xs text-indigo-700 font-black bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100 shadow-sm flex items-center">¥ ${item.auto_amount || 0.00} ${calibBadge}</span>`;
                } else {
                    const calibBadge = item.is_admin_calibrated ? `<span class="mr-1 text-[10px] text-emerald-600 font-bold">已校准</span>` : '';
                    amountUI = `
                        <div class="ml-3 flex items-center gap-1 bg-white border border-indigo-200 p-1 rounded-xl shadow-sm">
                            ${calibBadge}
                            <span class="text-xs text-indigo-500 font-extrabold pl-2">¥</span>
                            <input type="number" step="0.01" value="${item.auto_amount || 0.00}" id="item_amount_${item.id}" class="w-16 px-1 py-1 text-xs bg-indigo-50/50 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 text-indigo-800 font-black text-center transition-all" title="可手动校准系统智能测算的金额">
                            <button onclick="updateItemAmount('${item.id}')" class="text-[10px] bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1.5 rounded-lg transition font-bold shadow">保存</button>
                        </div>
                    `;
                }

                return `
                    <div class="bg-white border border-slate-200 p-5 rounded-[1.5rem] flex flex-col sm:flex-row justify-between items-start text-sm shadow-sm hover:shadow-md transition-shadow relative gap-5 group">
                        <div class="flex-1 w-full overflow-hidden">
                            <div class="font-extrabold text-slate-800 mb-3 border-b border-slate-100 pb-3 flex items-center flex-wrap gap-y-2">
                                <span class="bg-slate-800 text-white px-2 py-1 rounded-lg text-xs mr-1 shadow-sm">${item.type}</span>
                                ${amountUI}
                            </div>
                            <div class="grid grid-cols-2 gap-5 text-xs font-medium text-slate-600">
                                <div>
                                    <span class="font-bold text-slate-400 mb-1.5 block tracking-wide uppercase">发票 (${item.invoice_files ? item.invoice_files.length : 1})</span>
                                    <div class="space-y-1.5 bg-slate-50 p-2 rounded-lg">${invHtml}</div>
                                </div>
                                <div>
                                    <span class="font-bold text-slate-400 mb-1.5 block tracking-wide uppercase">附件 (${item.attachments.length})</span>
                                    <div class="space-y-1.5 bg-slate-50 p-2 rounded-lg">${attHtml}</div>
                                </div>
                            </div>
                            ${item.remark ? `<div class="mt-3 text-xs bg-amber-50/50 border border-amber-100 p-2.5 rounded-xl"><span class="font-bold text-amber-600/80">备注:</span> <span class="text-amber-900 font-bold ml-1">${item.remark}</span></div>` : ''}
                        </div>
                        ${!readOnly ? `<button onclick="deleteItem('${item.id}')" class="text-red-500 hover:text-white bg-red-50 hover:bg-red-500 border border-red-100 hover:border-red-500 px-3 py-2 rounded-xl font-bold shrink-0 transition-colors shadow-sm sm:opacity-0 sm:group-hover:opacity-100 focus:opacity-100">删除记录</button>` : ''}
                    </div>
                `;
            }).join('');
        }

        async function updateItemAmount(itemId) {
            const taskId = document.getElementById('currentTaskId').value;
            const amountInput = document.getElementById(`item_amount_${itemId}`).value;
            if(amountInput === '') return alert("请输入金额");
            
            const res = await fetch(`/api/user/item/${taskId}/${itemId}/amount`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({amount: parseFloat(amountInput)})
            });
            
            if(res.ok) {
                const refreshRes = await fetch('/api/user/tasks');
                const allTasks = await refreshRes.json();
                const updatedTask = allTasks.find(t => t.id == taskId);
                renderItemList(updatedTask.items, false, taskId);
                
                const btn = document.querySelector(`#item_amount_${itemId}`).nextElementSibling;
                const oldText = btn.innerText;
                btn.innerText = '已保存!';
                btn.classList.replace('bg-indigo-600', 'bg-emerald-500');
                setTimeout(() => {
                    btn.innerText = oldText;
                    btn.classList.replace('bg-emerald-500', 'bg-indigo-600');
                }, 2000);
            } else {
                alert("金额保存失败，可能任务已被锁定。");
            }
        }

        async function submitUploadFormSilently() {
            const btn = document.getElementById('saveDraftBtn');
            const taskId = document.getElementById('currentTaskId').value;
            const form = document.getElementById('uploadForm');
            const formData = new FormData(form);
            
            btn.innerHTML = '⏳ <span class="animate-pulse">正在智能识别并打包...</span>';
            btn.disabled = true;

            try {
                const res = await fetch(`/api/user/upload_item/${taskId}`, { method: 'POST', body: formData });
                
                if (res.status === 413) {
                    alert("❌ 上传失败：文件体积超出了网关/服务器的物理接收限制 (413 Payload Too Large)。");
                    return false;
                }

                if (!res.ok) {
                    let errMsg = `服务器错误 (${res.status})`;
                    try { errMsg = (await res.json()).message || errMsg; } catch (e) {} 
                    alert(`❌ 上传失败: ${errMsg}`);
                    return false;
                }

                const result = await res.json();
                if(result.status === 'success') {
                    const refreshRes = await fetch('/api/user/tasks');
                    const allTasks = await refreshRes.json();
                    const updatedTask = allTasks.find(t => t.id == taskId);
                    renderItemList(updatedTask.items, false, taskId);
                    form.reset();
                    document.querySelectorAll('input[name="type"]').forEach(r => r.checked = false);
                    handleTypeChange();
                    return true;
                } else {
                    alert(result.message);
                    return false;
                }
            } catch (err) {
                alert("❌ 上传异常：网络连接中断或请求超时。");
                return false;
            } finally {
                btn.innerText = '📥 保存此归类至草稿箱';
                btn.disabled = false;
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await submitUploadFormSilently();
        });

        async function deleteItem(itemId) {
            const taskId = document.getElementById('currentTaskId').value;
            if(!confirm(`确定删除这批归类文件吗？`)) return;
            
            const res = await fetch(`/api/user/item/${taskId}/${itemId}`, { method: 'DELETE' });
            if(res.ok) {
                const refreshRes = await fetch('/api/user/tasks');
                const allTasks = await refreshRes.json();
                const updatedTask = allTasks.find(t => t.id == taskId);
                renderItemList(updatedTask.items, false, taskId);
            } else {
                alert("删除失败, 可能任务已被结项。");
            }
        }

        async function submitFinal() {
            const taskId = document.getElementById('currentTaskId').value;
            const fileInput = document.getElementById('invoiceFiles');
            
            if (fileInput && fileInput.files.length > 0) {
                if(confirm("系统检测到您选择了发票但尚未【保存】。\n\n点击 [确定]，系统将为您自动保存并完成最终提交！")) {
                    const uploadSuccess = await submitUploadFormSilently();
                    if (!uploadSuccess) return; 
                } else {
                    return; 
                }
            }

            const itemNodes = document.getElementById('itemList').children;
            const hasItems = itemNodes.length > 0 && itemNodes[0].innerText.indexOf('尚未添加') === -1;
            
            if(!hasItems) {
                if(!confirm("您尚未上传任何发票，确定要直接提交空任务吗？")) return;
            } else {
                if(!confirm("🚀 确定完成提交吗？\n\n提交后该任务将锁定，您将无法再增加、删除或修改发票。")) return;
            }

            const res = await fetch(`/api/user/submit/${taskId}`, { method: 'POST' });
            if(res.ok) {
                closeModal();
                setTimeout(() => alert("✅ 提交成功！已发送至管理员。"), 300);
            } else {
                alert("提交失败，可能已被管理员结项操作锁定。");
            }
        }
    </script>
</body>
</html>
