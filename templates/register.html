<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - LabInvoice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-teal-50 via-slate-50 to-emerald-100 flex items-center justify-center min-h-screen relative overflow-hidden">
    
    <div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-emerald-400/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-96 h-96 bg-teal-400/20 rounded-full blur-3xl"></div>

    <div class="bg-white/80 backdrop-blur-xl p-10 rounded-[2rem] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.1)] border border-white w-full max-w-sm relative z-10">
        <div class="flex flex-col items-center justify-center mb-8">
            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-700 to-teal-600">创建报销账户</h2>
            <p class="text-sm text-slate-500 mt-2 font-medium">加入 LabInvoice</p>
        </div>
        
        {% if error %}
        <div class="bg-red-50/80 backdrop-blur border border-red-100 text-red-600 px-4 py-3 rounded-xl mb-6 text-sm text-center font-medium shadow-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">自定义登录账号</label>
                <input type="text" name="username" placeholder="建议使用姓名拼音" required 
                    class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all outline-none font-medium text-slate-700">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">设置密码</label>
                <input type="password" name="password" required 
                    class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all outline-none font-medium text-slate-700">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">您的真实姓名 <span class="text-red-500">*</span></label>
                <input type="text" name="real_name" required placeholder="如：张三" 
                    class="w-full px-4 py-3 bg-emerald-50/30 border border-emerald-200 rounded-xl focus:ring-4 focus:ring-emerald-500/20 focus:border-emerald-500 focus:bg-white transition-all outline-none font-bold text-emerald-800 placeholder-emerald-400">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold py-3.5 px-4 rounded-xl hover:shadow-[0_8px_20px_-6px_rgba(16,185,129,0.5)] hover:-translate-y-0.5 transition-all duration-200 mt-2">
                立即注册
            </button>
        </form>
        
        <div class="mt-8 pt-5 border-t border-slate-100 text-center text-sm font-medium text-slate-500">
            已有账户？ <a href="/login" class="text-teal-600 hover:text-teal-700 hover:underline transition-colors">返回安全登录</a>
        </div>
    </div>
</body>
</html>
