<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - LabInvoice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-blue-100 flex items-center justify-center min-h-screen relative overflow-hidden">
    
    <!-- 背景装饰光晕 -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-400/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-indigo-400/20 rounded-full blur-3xl"></div>

    <div class="bg-white/80 backdrop-blur-xl p-10 rounded-[2rem] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.1)] border border-white w-full max-w-sm relative z-10">
        <div class="flex flex-col items-center justify-center mb-8">
            <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-3.5 rounded-2xl mb-4 shadow-lg shadow-blue-500/30">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </div>
            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-600">用户登录</h2>
            <p class="text-sm text-slate-500 mt-1 font-medium">LabInvoice 报销管家</p>
        </div>
        
        {% if error %}
        <div class="bg-red-50/80 backdrop-blur border border-red-100 text-red-600 px-4 py-3 rounded-xl mb-6 text-sm text-center font-medium shadow-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">登录账号</label>
                <input type="text" name="username" required autofocus autocomplete="username" 
                    class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition-all outline-none font-medium text-slate-700">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">密码</label>
                <input type="password" name="password" value="123456" required autocomplete="current-password" 
                    class="w-full px-4 py-3 bg-slate-50/50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition-all outline-none font-medium text-slate-700">
            </div>
            
            <div class="flex items-center pt-1">
                <input id="remember" name="remember" type="checkbox" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-slate-300 rounded cursor-pointer transition">
                <label for="remember" class="ml-2 block text-sm font-medium text-slate-600 cursor-pointer select-none">
                    记住我（30天内免登录）
                </label>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 px-4 rounded-xl hover:shadow-[0_8px_20px_-6px_rgba(79,70,229,0.5)] hover:-translate-y-0.5 transition-all duration-200 mt-2">
                进入系统
            </button>
        </form>
        
        <div class="mt-8 flex flex-col items-center space-y-4 text-sm font-medium text-slate-500">
            <div>
                没有账户？ <a href="/register" class="text-indigo-600 hover:text-indigo-700 hover:underline transition-colors">自行注册账户</a>
            </div>
            <div class="pt-5 border-t border-slate-100 w-full text-center">
                <a href="/admin/login" class="text-slate-400 hover:text-slate-700 transition-colors flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    管理员通道
                </a>
            </div>
        </div>
    </div>
</body>
</html>
