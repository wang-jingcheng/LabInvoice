<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabInvoice - 管理员登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen relative overflow-hidden">
    
    <!-- 深色模式高亮光晕 -->
    <div class="absolute top-[-20%] left-[20%] w-96 h-96 bg-indigo-600/30 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-20%] right-[20%] w-96 h-96 bg-purple-600/20 rounded-full blur-[100px]"></div>

    <div class="bg-slate-800/60 backdrop-blur-2xl p-10 rounded-[2rem] shadow-2xl border border-slate-700 w-full max-w-sm relative z-10">
        <div class="flex flex-col items-center justify-center mb-8">
            <div class="bg-slate-700 p-3.5 rounded-2xl mb-4 shadow-inner border border-slate-600">
                <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold text-white">系统管理台</h2>
            <p class="text-sm text-slate-400 mt-1 font-medium">身份验证</p>
        </div>
        
        {% if error %}
        <div class="bg-red-900/30 border border-red-800/50 text-red-400 px-4 py-3 rounded-xl mb-6 text-sm text-center font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1.5">最高访问密码</label>
                <input type="password" name="password" required autofocus
                    class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl focus:ring-4 focus:ring-indigo-500/30 focus:border-indigo-500 focus:bg-slate-800 text-white transition-all outline-none font-medium">
            </div>
            <button type="submit"
                class="w-full bg-indigo-600 text-white font-bold py-3.5 px-4 rounded-xl hover:bg-indigo-500 hover:shadow-[0_8px_20px_-6px_rgba(99,102,241,0.6)] hover:-translate-y-0.5 transition-all duration-200 mt-4">
                进入工作台
            </button>
        </form>
        
        <div class="mt-8 pt-5 border-t border-slate-700 text-center text-sm font-medium">
            <a href="/login" class="text-slate-400 hover:text-white transition-colors flex items-center justify-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                返回用户大厅
            </a>
        </div>
    </div>
</body>
</html>
